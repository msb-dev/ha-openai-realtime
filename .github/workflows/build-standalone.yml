name: Build and Publish Standalone Image

# Container image for Home Assistant Container / plain Docker deployments
# (Dockerfile.standalone). The add-on images are built by build-addon.yml;
# this workflow is independent of them and safe to run on the same pushes.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'openai_realtime_voice_agent/**'
      - '.github/workflows/build-standalone.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'openai_realtime_voice_agent/**'
      - '.github/workflows/build-standalone.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # normalize to lowercase for ghcr (docker buildx refuses uppercase)
  IMAGE_NAME: ghcr.io/${{ github.repository }}-standalone

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' openai_realtime_voice_agent/config.yaml | sed 's/version: "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64,linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, except on PRs)
        uses: docker/build-push-action@v5
        with:
          context: ./openai_realtime_voice_agent
          file: ./openai_realtime_voice_agent/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Standalone image: \`${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
